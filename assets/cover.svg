<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Interactive Tutorial Video Skill</title>
  <desc id="description">Autonomous Playwright HUD overlays, Neural Voiceover Muxing, and YouTube Studio Uploads.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="16" height="630" fill="#10b981"/>

  <!-- Top metadata -->
  <g fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="80" y="90" font-size="20" font-weight="700" letter-spacing="4" fill="#34d399">OPEN AGENT SKILL</text>
    <text x="1120" y="90" text-anchor="end" font-size="18" font-weight="600" fill="#64748b">agentskills.io standard</text>
  </g>

  <!-- Big Title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="80" y="210" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">INTERACTIVE TUTORIAL</text>
    <text x="80" y="295" font-size="64" font-weight="900" fill="url(#emeraldGlow)" letter-spacing="-1">VIDEO AUTOMATION</text>
    <text x="80" y="375" font-size="28" font-weight="400" fill="#cbd5e1">Playwright HUD Overlays • Neural TTS Muxing • Autonomous YouTube Studio</text>
  </g>

  <line x1="80" y1="425" x2="1120" y2="425" stroke="#1e293b" stroke-width="2"/>

  <!-- Key pillars -->
  <g font-family="Courier New, monospace" font-size="20" font-weight="700">
    <text x="80" y="490" fill="#10b981">[01]</text>
    <text x="145" y="490" fill="#f8fafc">IN-BROWSER HUD</text>
    <text x="350" y="490" fill="#64748b">Pulsating halos, smart cursor, ripple waves</text>

    <text x="80" y="535" fill="#10b981">[02]</text>
    <text x="145" y="535" fill="#f8fafc">NEURAL VOICEOVER</text>
    <text x="350" y="535" fill="#64748b">Timeline sync with multi-dialect Arabic &amp; English</text>

    <text x="80" y="580" fill="#10b981">[03]</text>
    <text x="145" y="580" fill="#f8fafc">ZERO-AUTH YOUTUBE</text>
    <text x="350" y="580" fill="#64748b">macOS Keychain session extraction &amp; playlist sync</text>
  </g>

  <text x="1120" y="580" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500">yasircs4 / MIT</text>
</svg>
